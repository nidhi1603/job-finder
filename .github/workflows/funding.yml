name: funding

on:
  schedule:
    - cron: "41 4 * * *"        # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-finder-funding
  cancel-in-progress: false

jobs:
  funding:
    runs-on: ubuntu-latest
    timeout-minutes: 180         # the first run backfills 6 months of SEC filings
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find recently funded startups and their job boards
        run: python -u -m jobfinder.funding
        env:
          SEC_CONTACT: ${{ secrets.EMAIL_FROM }}   # SEC asks automated clients for a contact email
      - name: Save funded-startup list
        run: |
          git config user.name "job-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/funded.json
          if ! git diff --cached --quiet; then
            git commit -q -m "funded: daily update $(date -u +%Y-%m-%d)"
            git pull -q --rebase origin main && git push -q
          fi
