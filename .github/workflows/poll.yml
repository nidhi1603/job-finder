name: poll

on:
  schedule:
    - cron: "17 8 * * *"        # once a day, overnight: ~3:17am Eastern (4:17am in summer)
    - cron: "17 9 * * *"        # backups, because GitHub's scheduler sometimes skips runs; they do nothing
    - cron: "17 10 * * *"       # if that day's run already happened
  workflow_dispatch:
    inputs:
      all:
        description: "Check every board this run"
        type: boolean
        default: false
      backfill:
        description: "Load the last 15 days into the tracker sheet (no email)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-finder-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 150     # a daily run reads every board; a catch-up or backfill reads 15 days back
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load seen-jobs state (kept on the 'state' branch so main's history stays small)
        run: |
          git fetch -q origin state 2>/dev/null && git show FETCH_HEAD:data/seen.json > data/seen.json || echo "no state yet: catch-up run"
      - name: Find and filter new jobs, add them to the tracker, send the daily email
        run: python -m jobfinder.run ${{ github.event_name == 'schedule' && '--skip-if-ran-today' || '' }} ${{ inputs.all && '--all' || '' }} ${{ inputs.backfill && '--backfill' || '' }}
        env:
          PROFILE_SKILLS: ${{ secrets.PROFILE_SKILLS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SHEET_URL: ${{ secrets.SHEET_URL }}
          SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
          MIN_FIT: ${{ vars.MIN_FIT }}
          LOCAL_TZ: ${{ vars.LOCAL_TZ }}
      - name: Save seen-jobs state
        run: |
          [ -f data/seen.json ] || exit 0
          git config user.name "job-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan state-tmp
          git rm -rq --cached .
          git add -f data/seen.json
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf origin state-tmp:state
