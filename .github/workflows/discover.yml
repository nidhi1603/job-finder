name: discover

on:
  schedule:
    - cron: "23 6 1 * *"        # monthly, 1st of the month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-finder-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rebuild company board list
        run: python -u -m jobfinder.discover --crawls 2
      - name: Save board list
        run: |
          git config user.name "job-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boards.json
          if ! git diff --cached --quiet; then
            git commit -q -m "boards: monthly refresh $(date -u +%Y-%m-%d)"
            git pull -q --rebase origin main && git push -q
          fi
