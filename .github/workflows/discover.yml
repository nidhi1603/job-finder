name: discover

on:
  schedule:
    - cron: "23 6 * * *"        # daily; most days only a few boards are due and it finishes in minutes
  workflow_dispatch:
    inputs:
      recrawl:
        description: "Re-sweep Common Crawl now (otherwise every 30 days)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-finder-discover
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Update the company board list (stops at the time budget; the next run continues)
        run: python -u -m jobfinder.discover --budget-min 290 ${{ inputs.recrawl && '--recrawl' || '' }}
      - name: Save board list and progress
        if: always()
        run: |
          git config user.name "job-finder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/boards.json data/probes.json
          [ -f data/candidates.json ] && git add data/candidates.json
          if ! git diff --cached --quiet; then
            git commit -q -m "boards: update $(date -u +%Y-%m-%d)"
            git pull -q --rebase origin main && git push -q
          fi
